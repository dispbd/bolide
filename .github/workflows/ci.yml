name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The lowest supported version (engines: >=20.6) and the current LTS.
        node: ['20.6', 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check

  # Drivers that need a real database (packages/*/test/int). The spike's Electric tests stay local.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bolide
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bolide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:int:packages
