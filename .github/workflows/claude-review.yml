name: Claude review

# Reviews every pull request automatically when it is opened, updated or
# marked ready for review. Repository conventions come from CLAUDE.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped; forks get no secrets, so they are skipped too.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set one of the two secrets: an API key, or a token from `claude setup-token`.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first: it describes the
            project's principles and conventions.

            Focus, in this order:
            1. Correctness: bugs, unhandled edge cases, wrong error handling,
               async mistakes, resource leaks.
            2. Types: inference that breaks for users, `any` leaking into the
               public API, missing compile-time checks in test/types.check.ts.
            3. Design: does the change respect the principles in CLAUDE.md
               (no mandatory decorators, mistakes fail at boot, Hono stays
               behind the adapter, minimal dependencies)?
            4. Tests: is new behavior covered, including failure paths?
            5. Security issues of any kind.

            Rules:
            - Comment inline on specific lines; mark each finding as
              blocking or a nit.
            - Do not comment on formatting or on things that are fine.
            - Finish with one short summary comment: the verdict and the
              blocking findings, if any.
            - Write in English.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
