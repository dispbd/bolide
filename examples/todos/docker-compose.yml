# Postgres for development: `docker compose up -d`. wal_level=logical lets the app read changes from the WAL.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    command: postgres -c wal_level=logical
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
