# Postgres for development: `docker compose up -d postgres`.
# With Electric as the sync engine: `docker compose --profile electric up -d`, then ELECTRIC_URL=http://localhost:3001 npm run dev.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    command: postgres -c wal_level=logical
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  electric:
    profiles: [electric]
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todos?sslmode=disable
      # The app is Electric's only client and adds the read rules; keep port 3001 off the internet.
      ELECTRIC_INSECURE: 'true'
    ports:
      - 3001:3000
    depends_on:
      - postgres

volumes:
  pgdata:
